<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>七夕提前接业务</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(180deg, #fff0f3 0%, #fde2e7 100%);
      min-height: 100vh;
      color: #4a2c2c;
      padding: 20px 16px 100px;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 16px 0;
      position: relative;
    }
    .header h1 {
      font-size: 26px;
      color: #b83b43;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(184, 59, 67, 0.15);
    }
    .header p {
      font-size: 13px;
      color: #9c656b;
      letter-spacing: 1px;
    }
    .header .subtitle-pill {
      display: inline-block;
      margin-top: 8px;
      background: #ffe3e8;
      border: 1px dashed #f5899e;
      color: #d63031;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 12px;
      font-weight: 500;
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .item-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 16px rgba(220, 130, 145, 0.12);
      border: 1px solid #ffccd5;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .item-card:active {
      transform: scale(0.99);
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-icon {
      font-size: 16px;
    }
    .item-title {
      font-size: 16px;
      font-weight: 600;
      color: #3b2225;
    }
    .item-tag {
      font-size: 11px;
      color: #e65a65;
      background: #fff0f2;
      padding: 1px 6px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
      margin-top: 2px;
    }
    .item-price {
      font-size: 20px;
      font-weight: 700;
      color: #d63031;
      margin-top: 2px;
    }
    .item-price span {
      font-size: 13px;
      font-weight: 600;
      margin-right: 1px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fdf2f4;
      padding: 4px 6px;
      border-radius: 20px;
      border: 1px solid #ffd3d8;
    }
    .btn-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #b83b43;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
      transition: all 0.1s;
    }
    .btn-circle:active {
      background: #ffd3d8;
      transform: scale(0.9);
    }
    .count {
      font-size: 16px;
      font-weight: 700;
      min-width: 20px;
      text-align: center;
      color: #3b2225;
    }

    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(15px);
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -6px 20px rgba(184, 59, 67, 0.08);
      max-width: 440px;
      margin: 0 auto;
      border-top: 1px solid #ffe3e6;
      border-radius: 24px 24px 0 0;
      z-index: 10;
    }
    .total-box {
      display: flex;
      flex-direction: column;
    }
    .total-label {
      font-size: 12px;
      color: #888;
    }
    .total-val {
      font-size: 24px;
      font-weight: 800;
      color: #d63031;
    }
    .total-val span {
      font-size: 15px;
    }
    .checkout-btn {
      background: linear-gradient(135deg, #ff6b7b, #e83845);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232, 56, 69, 0.35);
      transition: all 0.2s;
    }
    .checkout-btn:active {
      transform: scale(0.96);
    }
    .checkout-btn:disabled {
      background: #e0d0d2;
      box-shadow: none;
      color: #a09092;
      cursor: not-allowed;
    }

    /* Modal / Pop-up */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 20px 18px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 24px;
      color: #999;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #2e7d32;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .order-summary {
      background: #fdf6f7;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      text-align: left;
      font-size: 13px;
      color: #666;
    }
    .order-summary .item-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .order-summary .total-line {
      border-top: 1px dashed #f3c7ce;
      padding-top: 6px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      color: #d63031;
      font-size: 15px;
    }
    
    .qr-container {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #e9ecef;
      display: flex;
      justify-content: center;
    }
    .qr-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      border-radius: 12px;
      display: block;
    }
    
    .pay-tip {
      font-size: 12px;
      color: #777;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, #09bb07, #079e05);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(9, 187, 7, 0.3);
    }
    .modal-btn:active {
      transform: scale(0.98);
    }

    .contact-title {
      color: #075e54;
    }
    .contact-back-btn {
      margin-top: 10px;
      background: #f0f0f0;
      color: #555;
      border: 1px solid #ddd;
      box-shadow: none;
      padding: 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>❤️ 七夕提前接业务 ❤️</h1>
      <p>诚信接单 · 童叟无欺 · 限量排单</p>
      <div class="subtitle-pill">✨ 支持单选/多选叠加 ✨</div>
    </div>

    <div class="service-list" id="list"></div>

    <button class="checkout-btn" id="pay-btn" onclick="openCheckoutModal()" disabled>立即购买</button>

  <script>
    const services = [
      { id: 1, name: "换情头", icon: "👩‍❤️‍👨", price: 1.9 },
      { id: 2, name: "换情名", icon: "✨", price: 1.9 },
      { id: 3, name: "秀恩爱", icon: "💖", price: 9.9 },
      { id: 4, name: "陪聊天", icon: "💬", price: 5.2 },
      { id: 5, name: "真谈", icon: "🌹", price: 52.0 },
      { id: 6, name: "让我滚", icon: "⚡", price: 1.0, tag: "性价比超高 [憨笑]" }
    ];

    const cart = {};

    function renderList() {
      const container = document.getElementById("list");
      container.innerHTML = services.map(item => `
        <div class="item-card">
          <div class="item-info">
            <div class="item-title-row">
              <span class="item-icon">${item.icon}</span>
              <span class="item-title">${item.name}</span>
            </div>
            ${item.tag ? `<div class="item-tag">${item.tag}</div>` : ''}
            <div class="item-price"><span>¥</span>${item.price.toFixed(1)}</div>
          </div>
          <div class="counter">
            <button class="btn-circle" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="count" id="qty-${item.id}">${cart[item.id] || 0}</span>
            <button class="btn-circle" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function updateQty(id, change) {
      const current = cart[id] || 0;
      const next = Math.max(0, current + change);
      if (next === 0) delete cart[id];
      else cart[id] = next;
      
      const qtyElem = document.getElementById(`qty-${id}`);
      if (qtyElem) qtyElem.innerText = next;
      updateTotal();
    }

    function updateTotal() {
      let total = 0;
      let count = 0;
      for (const id in cart) {
        const item = services.find(s => s.id == id);
        total += item.price * cart[id];
        count += cart[id];
      }
      document.getElementById("total-price").innerText = total.toFixed(2);
      document.getElementById("pay-btn").disabled = count === 0;
    }

    function openCheckoutModal() {
      const listElem = document.getElementById("order-items");
      let itemsHtml = '';
      let total = 0;
      for (const id in cart) {
        const item = services.find(s => s.id == id);
        const subtotal = (item.price * cart[id]).toFixed(2);
        total += item.price * cart[id];
        itemsHtml += `<div class="item-line"><span>${item.name} × ${cart[id]}</span><b>¥${subtotal}</b></div>`;
      }
      listElem.innerHTML = itemsHtml;
      document.getElementById("modal-total-price").innerText = `¥${total.toFixed(2)}`;
      
      document.getElementById("pay-modal").style.display = 'flex';
    }

    function closePayModal() {
      document.getElementById("pay-modal").style.display = 'none';
    }

    function openContactModal() {
      document.getElementById("pay-modal").style.display = 'none';
      document.getElementById("contact-modal").style.display = 'flex';
    }

    function closeContactModal() {
      document.getElementById("contact-modal").style.display = 'none';
    }

    function backToPayModal() {
      document.getElementById("contact-modal").style.display = 'none';
      document.getElementById("pay-modal").style.display = 'flex';
    }

    function copyWechat(wechatId) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(wechatId).then(() => {
          alert("✅ 微信号 [" + wechatId + "] 已复制到剪贴板！\n\n请打开微信粘贴搜索添加好友，发送支付截图兑现业务~");
        }).catch(() => {
          prompt("请手动复制微信号：", wechatId);
        });
      } else {
        const input = document.createElement("input");
        input.setAttribute("value", wechatId);
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        document.body.removeChild(input);
        alert("✅ 微信号 [" + wechatId + "] 已复制到剪贴板！\n\n请打开微信粘贴搜索添加好友，发送支付截图兑现业务~");
      }
      document.getElementById("contact-modal").style.display = 'none';
    }

    function finishAll() {
      copyWechat("xiamaomiii_777");
    }

    renderList();
  </script>
